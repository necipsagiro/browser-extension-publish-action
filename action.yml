name: 'Publish Browser Extensions'
description: 'Build and publish Chrome and Firefox extensions to their respective stores'
branding:
  icon: 'package'
  color: 'blue'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'
  pnpm-version:
    description: 'pnpm version to use'
    required: false
    default: '9'
  manifest-path:
    description: 'Path to manifest.json file'
    required: false
    default: 'src/manifest.json'
  build-chrome-command:
    description: 'Command to build Chrome extension'
    required: false
    default: 'pnpm run build:chrome'
  build-firefox-command:
    description: 'Command to build Firefox extension'
    required: false
    default: 'pnpm run build:firefox'
  chrome-zip-path:
    description: 'Path to Chrome extension zip file'
    required: false
    default: 'dist/chrome-extension.zip'
  firefox-zip-path:
    description: 'Path to Firefox extension zip file'
    required: false
    default: 'dist/firefox-extension.zip'
  chrome-client-id:
    description: 'Chrome Web Store Client ID'
    required: false
  chrome-client-secret:
    description: 'Chrome Web Store Client Secret'
    required: false
  chrome-refresh-token:
    description: 'Chrome Web Store Refresh Token'
    required: false
  chrome-publisher-id:
    description: 'Chrome Web Store Publisher ID'
    required: false
  chrome-extension-id:
    description: 'Chrome Web Store Extension ID'
    required: false
  firefox-guid:
    description: 'Firefox Add-on GUID (from manifest.json browser_specific_settings.gecko.id)'
    required: false
  firefox-jwt-issuer:
    description: 'Firefox JWT Issuer'
    required: false
  firefox-jwt-secret:
    description: 'Firefox JWT Secret'
    required: false
  create-release:
    description: 'Whether to create a GitHub release'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for creating releases'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check Version and Prepare for Publish
      id: version_check
      shell: bash
      run: |
        set -euo pipefail
        VERSION=$(node -p "require('./${{ inputs.manifest-path }}').version")
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

        # Check if at least one set of credentials is provided
        HAS_CHROME=$([ -n "${{ inputs.chrome-client-id }}" ] && [ -n "${{ inputs.chrome-client-secret }}" ] && [ -n "${{ inputs.chrome-refresh-token }}" ] && [ -n "${{ inputs.chrome-publisher-id }}" ] && [ -n "${{ inputs.chrome-extension-id }}" ] && echo "true" || echo "false")
        HAS_FIREFOX=$([ -n "${{ inputs.firefox-jwt-issuer }}" ] && [ -n "${{ inputs.firefox-jwt-secret }}" ] && echo "true" || echo "false")

        if [ "$HAS_CHROME" = "false" ] && [ "$HAS_FIREFOX" = "false" ]; then
          echo "Error: At least one set of credentials (Chrome or Firefox) must be provided"
          exit 1
        fi

        echo "has_chrome=${HAS_CHROME}" >> $GITHUB_OUTPUT
        echo "has_firefox=${HAS_FIREFOX}" >> $GITHUB_OUTPUT

        # Read Firefox GUID from manifest if not provided
        if [ -z "${{ inputs.firefox-guid }}" ]; then
          FIREFOX_GUID=$(node -p "require('./${{ inputs.manifest-path }}').browser_specific_settings?.gecko?.id || ''")
          if [ -n "$FIREFOX_GUID" ]; then
            echo "firefox_guid=${FIREFOX_GUID}" >> $GITHUB_OUTPUT
          fi
        else
          echo "firefox_guid=${{ inputs.firefox-guid }}" >> $GITHUB_OUTPUT
        fi

        LATEST_TAG=$(git tag --list 'v*' | sed 's/^v//' | sort -V | tail -1)
        if [ -z "$LATEST_TAG" ]; then
          echo "No release tags found. Proceeding to publish v${VERSION}."
          echo "publish=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        HIGHEST_VERSION=$(printf '%s\n' "${LATEST_TAG}" "${VERSION}" | sort -V | tail -1)
        if [ "${HIGHEST_VERSION}" != "${VERSION}" ] || [ "${LATEST_TAG}" = "${VERSION}" ]; then
          echo "Version ${VERSION} is not newer than latest tag ${LATEST_TAG}. Skipping publish."
          echo "publish=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "Version ${VERSION} is new and greater than ${LATEST_TAG}. Proceeding to publish."
        echo "publish=true" >> "$GITHUB_OUTPUT"

    - name: Set up pnpm
      if: steps.version_check.outputs.publish == 'true'
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Set up Node.js
      if: steps.version_check.outputs.publish == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      if: steps.version_check.outputs.publish == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build Chrome extension
      if: steps.version_check.outputs.publish == 'true' && steps.version_check.outputs.has_chrome == 'true'
      shell: bash
      run: ${{ inputs.build-chrome-command }}

    - name: Build Firefox extension
      if: steps.version_check.outputs.publish == 'true' && steps.version_check.outputs.has_firefox == 'true'
      shell: bash
      run: ${{ inputs.build-firefox-command }}

    - name: Upload Chrome build artifact
      if: steps.version_check.outputs.publish == 'true' && steps.version_check.outputs.has_chrome == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: chrome-extension
        path: ${{ inputs.chrome-zip-path }}

    - name: Upload Firefox build artifact
      if: steps.version_check.outputs.publish == 'true' && steps.version_check.outputs.has_firefox == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: firefox-extension
        path: ${{ inputs.firefox-zip-path }}

    - name: Publish to Chrome Web Store
      if: steps.version_check.outputs.publish == 'true' && steps.version_check.outputs.has_chrome == 'true'
      shell: bash
      env:
        CLIENT_ID: ${{ inputs.chrome-client-id }}
        CLIENT_SECRET: ${{ inputs.chrome-client-secret }}
        REFRESH_TOKEN: ${{ inputs.chrome-refresh-token }}
        PUBLISHER_ID: ${{ inputs.chrome-publisher-id }}
        EXTENSION_ID: ${{ inputs.chrome-extension-id }}
      run: |
        set -euo pipefail

        # Get access token
        echo "Getting access token..."
        TOKEN_RESPONSE=$(curl -s -X POST https://oauth2.googleapis.com/token \
          -d "client_id=${CLIENT_ID}" \
          -d "client_secret=${CLIENT_SECRET}" \
          -d "refresh_token=${REFRESH_TOKEN}" \
          -d "grant_type=refresh_token")

        ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')
        if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
          echo "Failed to get access token:"
          echo "$TOKEN_RESPONSE" | jq .
          exit 1
        fi
        echo "Access token obtained successfully"

        # Cancel any pending submission (if exists)
        echo "Canceling any pending submission..."
        CANCEL_RESPONSE=$(curl -s -X POST \
          -H "Authorization: Bearer ${ACCESS_TOKEN}" \
          -H "x-goog-api-version: 2" \
          "https://chromewebstore.googleapis.com/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:cancelSubmission")

        if echo "$CANCEL_RESPONSE" | jq -e '.error' > /dev/null 2>&1; then
          echo "No pending submission to cancel (or already published)"
        else
          echo "Pending submission canceled"
        fi

        # Upload package using v2 API
        echo "Uploading extension package..."
        UPLOAD_RESPONSE=$(curl -s -X POST \
          -H "Authorization: Bearer ${ACCESS_TOKEN}" \
          -H "x-goog-api-version: 2" \
          -T ${{ inputs.chrome-zip-path }} \
          "https://chromewebstore.googleapis.com/upload/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:upload")

        UPLOAD_STATE=$(echo "$UPLOAD_RESPONSE" | jq -r '.uploadState')
        echo "Upload response:"
        echo "$UPLOAD_RESPONSE" | jq .

        if [ "$UPLOAD_STATE" != "SUCCEEDED" ]; then
          echo "Upload failed with state: $UPLOAD_STATE"
          exit 1
        fi
        echo "Upload successful"

        # Publish using v2 API
        echo "Publishing extension..."
        PUBLISH_RESPONSE=$(curl -s -X POST \
          -H "Authorization: Bearer ${ACCESS_TOKEN}" \
          -H "Content-Type: application/json" \
          -H "x-goog-api-version: 2" \
          -d '{"publishType": "DEFAULT_PUBLISH"}' \
          "https://chromewebstore.googleapis.com/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:publish")

        echo "Publish response:"
        echo "$PUBLISH_RESPONSE" | jq .

        # Check for errors
        if echo "$PUBLISH_RESPONSE" | jq -e '.error' > /dev/null 2>&1; then
          echo "Publish failed"
          exit 1
        fi
        echo "Chrome extension published successfully"

    - name: Publish to Firefox Add-ons
      if: steps.version_check.outputs.publish == 'true' && inputs.firefox-jwt-issuer != '' && inputs.firefox-jwt-secret != ''
      uses: wdzeng/firefox-addon@v1
      with:
        addon-guid: ${{ steps.version_check.outputs.firefox_guid }}
        xpi-path: ${{ inputs.firefox-zip-path }}
        jwt-issuer: ${{ inputs.firefox-jwt-issuer }}
        jwt-secret: ${{ inputs.firefox-jwt-secret }}

    - name: Create and Push Git Tag
      if: steps.version_check.outputs.publish == 'true'
      shell: bash
      run: |
        set -euo pipefail
        VERSION=${{ steps.version_check.outputs.version }}
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "v${VERSION}"
        git push origin "v${VERSION}"

    - name: Create GitHub Release
      if: steps.version_check.outputs.publish == 'true' && inputs.create-release == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        VERSION=${{ steps.version_check.outputs.version }}
        RELEASE_FILES=""

        if [ "${{ steps.version_check.outputs.has_chrome }}" = "true" ] && [ -f "${{ inputs.chrome-zip-path }}" ]; then
          RELEASE_FILES="$RELEASE_FILES ${{ inputs.chrome-zip-path }}"
        fi

        if [ "${{ steps.version_check.outputs.has_firefox }}" = "true" ] && [ -f "${{ inputs.firefox-zip-path }}" ]; then
          RELEASE_FILES="$RELEASE_FILES ${{ inputs.firefox-zip-path }}"
        fi

        if [ -n "$RELEASE_FILES" ]; then
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            $RELEASE_FILES
        else
          echo "No extension files to attach to release"
        fi
